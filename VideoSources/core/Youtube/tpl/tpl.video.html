<style>
	#ilInteractiveVideo {
		float: none;
		clear: both;
		position: relative;
	}
	.ilInteractiveVideoPlayerContainer{
		position: relative;
		padding-bottom: 56.25%;
		padding-top: 30px;
		height: 0;
		overflow: hidden;
	}
	.ilInteractiveVideoPlayerContainer iframe {
		top: 0;
		left: 0;
		width: 100%;
		padding-top:15px;
		position: absolute;
		border: 0;
		height: 100%;
	}
	.ilInteractiveVideoPlayerContainer {
		text-align: center;
	}
	/* YouTube consent ("two-click") overlay: nothing is loaded from YouTube
	   until the user actively agrees. Keeps a 16:9 look on wide layouts but
	   grows in height when the container gets too narrow, so the button never
	   gets clipped. */
	.iv_youtube_consent {
		position: relative;
		width: 100%;
		aspect-ratio: 16 / 9;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #1a1a1a;
		color: #fff;
		border-radius: 4px;
	}
	.iv_youtube_consent_inner {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		text-align: center;
		max-width: 640px;
		padding: 1.25em;
		box-sizing: border-box;
	}
	.iv_youtube_consent_icon {
		font-size: 3em;
		line-height: 1;
		margin-bottom: .3em;
		opacity: .85;
	}
	.iv_youtube_consent_title {
		font-size: 1.25em;
		font-weight: bold;
		margin-bottom: .5em;
	}
	.iv_youtube_consent_text {
		font-size: .95em;
		line-height: 1.45;
		margin-bottom: 1.2em;
		opacity: .9;
	}
	.iv_youtube_consent_text a { color: #8ab4f8; }
	.iv_youtube_consent_btn { flex: none; }
	.iv_youtube_consent_hidden { display: none !important; }
	/* Very narrow containers: drop the icon and tighten spacing so the
	   notice + button stay compact. */
	@media (max-width: 480px) {
		.iv_youtube_consent_icon { display: none; }
		.iv_youtube_consent_inner { padding: 1em; }
		.iv_youtube_consent_title { font-size: 1.1em; }
		.iv_youtube_consent_text { font-size: .9em; margin-bottom: 1em; }
	}
</style>
<script>
	var interactiveVideoYoutubeId = "{YOUTUBE_ID}";
</script>
<!-- TODO: fix marker editing -->
<div>
	<div id="ilInteractiveVideoTag"></div>
	<div id="iv_youtube_consent_{PLAYER_ID}" class="iv_youtube_consent" data-consent-player="{PLAYER_ID}">
		<div class="iv_youtube_consent_inner">
			<div class="iv_youtube_consent_icon" aria-hidden="true">&#9658;</div>
			<div class="iv_youtube_consent_title">{CONSENT_TITLE}</div>
			<div class="iv_youtube_consent_text">{CONSENT_TEXT}</div>
			<button type="button" class="btn btn-primary iv_youtube_consent_btn" data-consent-player="{PLAYER_ID}">{CONSENT_BUTTON}</button>
		</div>
	</div>
	<div class="iv_metadata iv_youtube_consent_hidden" data-plyr-player-id="{PLAYER_ID}">
		<div id="{PLAYER_ID}" class="ilInteractiveVideo" data-plyr-provider="youtube" data-plyr-embed-id="{YOUTUBE_ID}"></div>
	</div>

</div>
